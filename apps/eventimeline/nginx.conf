server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The container sits behind a proxy that forwards its own host: nginx builds
    # absolute Location headers from that Host, so an absolute redirect would send
    # the visitor to a name that only resolves on the LAN. Keep them relative.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite-hashed assets and self-hosted fonts: aggressive, immutable cache
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client identity for the API rate limiter. Only the immediate peer may name
    # the client: cloudflared or the host proxy runs on a private address, and
    # Cloudflare sets CF-Connecting-IP at its edge. A request that does not arrive
    # from these ranges — a visitor reaching this port directly — keeps its real
    # address, so a forged CF-Connecting-IP or X-Forwarded-For cannot move it into
    # another limiter bucket. Without this block every client shares one bucket
    # (coarse, but never chosen by the caller).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # /api/ is served by the api service (Bun) on the compose network. The API
    # port is not published: only this proxy reaches it.
    location /api/ {
        proxy_pass http://api:8787;
        proxy_set_header Host $host;
        # $remote_addr is the client already resolved (realip above). The caller's
        # X-Forwarded-For is discarded rather than appended, and CF-Connecting-IP
        # is not forwarded: the API must never see a caller-controlled value.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        client_max_body_size 8k;
    }

    # One page, one URL: /es and both index.html forms go to their canonical form.
    location = /es { return 301 /es/; }
    location = /es/index.html { return 301 /es/; }
    location = /index.html { return 301 /; }

    # Browsers only apply the sitemap stylesheet when it arrives as XML; nginx's
    # mime.types has no entry for .xsl and would send application/octet-stream.
    location = /sitemap.xsl {
        default_type text/xsl;
    }

    # Everything is served prerendered (one page per language): a route nobody
    # wrote responds 404, not the landing with 200. `$uri/index.html` instead of
    # `$uri/` keeps the index module out of it: `$uri/` redirects the canonical
    # URL to itself in a loop.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }
}
