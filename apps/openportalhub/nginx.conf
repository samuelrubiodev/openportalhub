server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative. This container sits behind a proxy that forwards its
    # own host (openportalhub.lan), and nginx builds absolute redirect Locations from
    # the Host it receives, so an absolute redirect would send visitors to a host that
    # only resolves on the LAN. Relative Locations are resolved by the browser against
    # the public host, whatever the proxy in front is.
    absolute_redirect off;

    # Long-lived cache for Vite's content-hashed assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client identity for the API rate limiter. Only the immediate peer may name
    # the client: cloudflared or the host reverse proxy runs on a private address,
    # and Cloudflare sets CF-Connecting-IP at its edge. A request that does not
    # come from these ranges — a visitor reaching this port directly — keeps its
    # real peer address, so a forged CF-Connecting-IP or X-Forwarded-For cannot
    # move it into another rate-limit bucket. Without this block every client
    # shares one bucket (coarse, but never caller-chosen).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # /api/ is served by the api service (Bun) on the compose network. The API port
    # is not published — only this proxy reaches it.
    location /api/ {
        proxy_pass http://api:8787;
        proxy_set_header Host $host;
        # $remote_addr is the resolved client (realip above). The caller's own
        # X-Forwarded-For is dropped rather than appended, and CF-Connecting-IP is
        # not forwarded at all: the API must never see a caller-controlled value.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        client_max_body_size 8k;
    }

    # Clean URLs: /event-timeline serves event-timeline.html.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # The Spanish pages live in /es/ as real files. Without this, /es would serve
    # /es/index.html at a second URL and compete with /es/.
    location = /es { return 301 /es/; }

    # Browsers only apply the sitemap stylesheet when it arrives as XML. nginx's
    # default mime.types has no entry for .xsl, so it would be served as
    # application/octet-stream and the sitemap would keep rendering as bare text.
    location = /sitemap.xsl {
        default_type text/xsl;
    }
}
